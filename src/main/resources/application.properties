spring.application.name=mcpLocation

#spring.main.banner-mode=off
#logging.pattern.console=
#logging.file.name=./target/mcpLocationService.log
#spring.ai.mcp.server.name=mcp-location-server
#spring.ai.mcp.server.version=0.0.1

spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=geolonia-mcp
spring.ai.mcp.server.base-url=/mcp
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=true
spring.ai.mcp.server.capabilities.prompt=true
spring.ai.mcp.server.capabilities.completion=true
spring.ai.mcp.server.protocol=STREAMABLE

server.allow.cors=true
server.servlet.context-path=/mcpLocation

# Suppress Spring AI MCP BeanPostProcessor ordering warning (framework-level issue, not functional)
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate$BeanPostProcessorChecker=ERROR

